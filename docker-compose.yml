services:
  db:
    image: mariadb:11
    container_name: expense-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-expense_tracker}
      MYSQL_USER: ${DB_USER:-expense_user}
      MYSQL_PASSWORD: ${DB_PASS:-change_me}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${DB_USER:-expense_user}",
          "-p${DB_PASS:-change_me}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  app:
    build: .
    container_name: expense-app
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/${DB_NAME:-expense_tracker}
      DB_USER: ${DB_USER:-expense_user}
      DB_PASS: ${DB_PASS:-change_me}
      JWT_SECRET: ${JWT_SECRET:-ThisIsADevOnlySecretKey!}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
